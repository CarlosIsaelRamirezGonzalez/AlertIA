# Corre las pruebas en cada push y cada PR.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flasky
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Las pruebas cubren reglas y configuración: no necesitan Flask, MongoDB ni TensorFlow.
      - run: pip install pydantic==2.14.3
      - run: python -m unittest discover -s tests -v
